# Copy to secret.yaml, replace all CHANGE_ME values, and keep secret.yaml out of Git.
apiVersion: v1
kind: Secret
metadata:
  name: cloudtask-secrets
  namespace: cloudtask
type: Opaque
stringData:
  # The API and worker use the application role. The migration Job overrides this
  # value with CLOUDTASK_MIGRATION_DATABASE_URL.
  CLOUDTASK_DATABASE_URL: postgresql+psycopg://cloudtask_app:CHANGE_ME@CHANGE_ME:5432/cloudtask
  CLOUDTASK_MIGRATION_DATABASE_URL: postgresql+psycopg://cloudtask_migrate:CHANGE_ME@CHANGE_ME:5432/cloudtask
  CLOUDTASK_RABBITMQ_URL: amqp://CHANGE_ME
  CLOUDTASK_S3_ENDPOINT_URL: https://CHANGE_ME
  CLOUDTASK_S3_ACCESS_KEY: CHANGE_ME
  CLOUDTASK_S3_SECRET_KEY: CHANGE_ME
  CLOUDTASK_JWT_SECRET: CHANGE_ME
  CLOUDTASK_BOOTSTRAP_USER_EMAIL: operator@example.com
  CLOUDTASK_BOOTSTRAP_USER_PASSWORD: CHANGE_ME
