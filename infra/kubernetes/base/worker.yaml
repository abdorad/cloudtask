apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cloudtask
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudtask-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudtask-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/CHANGE_ME/cloudtask-api:CHANGE_ME
          command: ["python", "-m", "app.worker.main"]
          ports:
            - containerPort: 8001
              name: metrics
          envFrom:
            - configMapRef:
                name: cloudtask-config
            - secretRef:
                name: cloudtask-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: cloudtask
spec:
  selector:
    app.kubernetes.io/name: cloudtask-worker
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
