apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cloudtask
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudtask-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudtask-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/CHANGE_ME/cloudtask-api:CHANGE_ME
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cloudtask-config
            - secretRef:
                name: cloudtask-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cloudtask
spec:
  selector:
    app.kubernetes.io/name: cloudtask-api
  ports:
    - name: http
      port: 8000
      targetPort: http
