# Adapt namespace/ingress-controller selectors before applying. This template is not
# included in kustomization because every cluster labels its ingress differently.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudtask-default-deny
  namespace: cloudtask
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 443
