apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudtask
  namespace: cloudtask
spec:
  ingressClassName: nginx
  rules:
    - host: cloudtask.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
