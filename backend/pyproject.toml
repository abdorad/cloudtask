[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtask-backend"
version = "0.1.0"
description = "CloudTask FastAPI API and asynchronous CSV worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika==9.5.5",
  "alembic==1.15.2",
  "boto3==1.37.18",
  "fastapi==0.115.12",
  "email-validator==2.2.0",
  "pwdlib[argon2]==0.2.1",
  "PyJWT==2.10.1",
  "prometheus-client==0.21.1",
  "psycopg[binary]==3.2.6",
  "pydantic-settings==2.8.1",
  "python-multipart==0.0.20",
  "SQLAlchemy==2.0.40",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "testcontainers[postgres]==4.9.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires Docker and supporting services",
]
